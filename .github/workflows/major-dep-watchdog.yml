# Upkeep PR #1: reviewed shared implementation pinned to 7147364e6698cf58716d1975e9aec4cf444e8f1a.
name: major-dep-watchdog

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      credentials_only:
        description: Verify App access without scanning PRs
        type: boolean
        default: false

concurrency:
  group: major-dep-watchdog-scan
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  watchdog:
    uses: BohdanMoroz11/upkeep/.github/workflows/watchdog.yml@7147364e6698cf58716d1975e9aec4cf444e8f1a
    with:
      app-client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
      app-slug: ${{ vars.DEP_AGENT_APP_SLUG }}
      base-branch: main
      ci-workflow: ci.yml
      review-workflow: major-dep-agent.yml
      retry-workflow: major-dep-agent-ci-retry.yml
      notification-target: BohdanMoroz11
      legacy-comment-author: BohdanMoroz11
      node-version: 26.13.0
      sanity-command: npm run typecheck
      credentials-only: ${{ inputs.credentials_only || false }}
    secrets:
      app-private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
