name: claude-major-agent
on:
  pull_request:
    types: [opened, labeled]
  # The watchdog re-dispatches this when a blocked bump actually changes — see
  # major-dep-watchdog.yml. Deliberately NOT `pull_request: synchronize`: the agent pushes
  # with GHCR_PAT, so `github.actor` is the token owner rather than a bot, and the actor
  # guard below would not break the resulting self-trigger loop.
  # `labeled` is restricted to `dep:major-review` for the same reason: applying
  # `dep:blocked` is also a labeled event from the PAT owner, and would otherwise
  # cancel the in-flight run and start a duplicate adjudication.
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to adjudicate
        required: true

concurrency:
  group: claude-major-agent-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  agent:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.actor != 'claude[bot]' &&
       (
         (github.event.action == 'opened' &&
          contains(github.event.pull_request.labels.*.name, 'dep:major-review')) ||
         (github.event.action == 'labeled' &&
          github.event.label.name == 'dep:major-review')
       ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Resolve PR context once so the rest of the job is event-shape agnostic.
      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          DATA=$(gh pr view "$PR" --repo "${{ github.repository }}" \
            --json headRefName,headRefOid,labels)
          {
            echo "number=$PR"
            echo "head_ref=$(echo "$DATA" | jq -r .headRefName)"
            echo "head_sha=$(echo "$DATA" | jq -r .headRefOid)"
            echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GHCR_PAT }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.0

      # NON-FATAL, and that is the whole point. A major bump that Renovate could not resolve
      # a lockfile for leaves the branch uninstallable — which is exactly the case where the
      # agent's judgement is most needed. Gating the agent behind a green install made the
      # automation fail closed precisely when it mattered. The install result is evidence now,
      # not a precondition.
      - name: Install dependencies (evidence, non-fatal)
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/install.log

      - name: Capture install log
        if: always()
        id: installlog
        run: |
          {
            echo 'log<<INSTALL_LOG_EOF'
            tail -n 120 /tmp/install.log 2>/dev/null || echo '(no install log produced)'
            echo 'INSTALL_LOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "renovate[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GHCR_PAT }}
          claude_args: |
            --model sonnet
            --max-turns 50
            --permission-mode acceptEdits
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,WebSearch,WebFetch,Bash(git:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(npm run typecheck),Bash(npm view:*),Bash(npm ls:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
          prompt: |
            This PR (#${{ steps.pr.outputs.number }}) is a MAJOR dependency bump. You are the
            AUTHOR, not the validator — CI runs the full test suite (incl. e2e), so do NOT run
            build/unit/e2e yourself.

            YOUR DELIVERABLE IS A VERDICT. Code changes are one possible consequence of a
            verdict, never the goal. Finishing without posting a verdict comment is a failure,
            no matter what else you did.

            ## Dependency install status: ${{ steps.install.outcome }}

            `npm ci` output (last 120 lines):
            ```
            ${{ steps.installlog.outputs.log }}
            ```

            If the install FAILED, that is not an obstacle to your work — it is your primary
            evidence. A lockfile that is out of sync with package.json almost always means
            Renovate hit a peer-dependency conflict and pushed the bump anyway; check the PR
            comments (`gh pr view ${{ steps.pr.outputs.number }} --comments`) for Renovate's
            own "Artifact update problem" report.

            ## Steps

            1. Identify the dependency and version change from the diff + release notes.
            2. Read the actual changelog / migration guide for the new major using WebFetch
               (and WebSearch to locate it if needed). The release-notes excerpt Renovate
               embeds in the PR body is NOT sufficient — it can be truncated, and it omits
               migration guides. Only cite URLs you fetched.
            3. Determine whether the bump is even ADOPTABLE. Do this mechanically, not from
               memory: for each direct dependent of the bumped package, run
               `npm view <dependent>@latest peerDependencies`. If the LATEST PUBLISHED version
               of a dependent still excludes the new major, the ecosystem has not caught up and
               the verdict is BLOCKED — name the dependent, its latest version, its peer range,
               and what would have to ship to unblock it.
            4. POLICY — never force a bump past an unsatisfiable peer range. No `overrides`, no
               `--legacy-peer-deps`, no `--force`. Doing so ships a toolchain that cannot build
               or check this repo while CI may still look green. An unsatisfiable peer on the
               dependent's latest release is BLOCKED, full stop.
            5. If it IS adoptable: decide whether this repo needs any code changes. Many majors
               need none — if so, say so plainly and DO NOT invent changes. If changes are
               needed, make them (follow CLAUDE.md / AGENTS.md), run ONLY `npm run typecheck`
               as a sanity check, and commit to this PR's branch.

            ## Verdict (mandatory)

            Pick EXACTLY ONE:

            - CLEAN       — adoptable, no repo changes needed; CI will prove it.
            - MIGRATED    — adoptable; changes made and pushed. Say what and why.
            - BLOCKED     — not adoptable yet. Name the exact upstream constraint and what must
                            ship first. Make no code changes.
            - NEEDS-HUMAN — a real judgement call (API redesign, behaviour tradeoff). Say what
                            is blocking instead of guessing; push nothing speculative.

            ALWAYS post it, as the LAST thing you do:

              gh pr comment ${{ steps.pr.outputs.number }} --body "..."

            After any commit and push, read the final local HEAD with `git rev-parse HEAD`
            and the PR's remote head with `gh pr view ${{ steps.pr.outputs.number }} --json headRefOid`.
            They MUST match. If the PR moved unexpectedly, stop rather than reporting a
            verdict for code you did not review. Use that final SHA in the comment marker.
            The comment body MUST BEGIN with exactly this marker line, substituting your
            chosen verdict and the final SHA:

              <!-- dep-verdict:<VERDICT>:<FINAL_HEAD_SHA> -->

            This marker is how the automation knows you reported for the current commit;
            get it exactly right. Follow it with a
            human-readable heading and the detail. For every breaking change you mention,
            include a direct link to the changelog/release-notes URL you read it from.

            If and ONLY if your verdict is BLOCKED, also run:

              gh api -X POST "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/labels" -f "labels[]=dep:blocked"

            (Use that REST call, NOT `gh pr edit --add-label` — the latter resolves labels
            over GraphQL and fails on this token for lack of org-read scope.)

            That label stops the CI-retry loop from burning attempts on a bump that cannot
            work, and silences the dormancy watchdog. It is cleared automatically when the
            bumped version specifier or its lockfile entry actually changes — not merely
            when the branch is rebased onto main — so a blocked PR re-adjudicates itself
            once upstream catches up.

      # Check the outcome for the FINAL head, including any commit the agent pushed.
      - name: Verify a verdict was posted
        id: verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          DATA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid,labels,comments)
          REMOTE_SHA=$(jq -r .headRefOid <<<"$DATA")
          LOCAL_SHA=$(git rev-parse HEAD 2>/dev/null || true)
          VERDICT=$(jq -r --arg sha "$REMOTE_SHA" --arg owner "${{ github.repository_owner }}" --arg started "${{ steps.pr.outputs.started_at }}" '
            [.comments[] | select(.author.login == $owner and .createdAt > $started) | .body
             | capture("^<!-- dep-verdict:(?<verdict>CLEAN|MIGRATED|BLOCKED|NEEDS-HUMAN):" + $sha + " -->")? | .verdict]
            | last // ""' <<<"$DATA")
          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ] && [ -n "$VERDICT" ]; then
            echo "Verdict $VERDICT posted for final head $REMOTE_SHA."
            if [ "$VERDICT" = 'BLOCKED' ] && ! jq -e '.labels[].name | select(. == "dep:blocked")' <<<"$DATA" >/dev/null; then
              gh api -X POST "repos/${{ github.repository }}/issues/$PR_NUMBER/labels" -f "labels[]=dep:blocked" >/dev/null
            fi
            {
              echo "verdict=$VERDICT"
              echo "head_sha=$REMOTE_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MARKER="<!-- watchdog:$REMOTE_SHA -->"
          ALREADY=$(jq --arg marker "$MARKER" '[.comments[].body | select(contains($marker))] | length' <<<"$DATA")
          if [ "$ALREADY" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$(printf '%s\n⚠️ @BohdanMoroz11 — the major-dependency review produced no verdict for its final head `%s` (or the branch moved during review). See the [run](%s). This PR needs a manual look.\n\n_(automated — one ping per commit)_' \
              "$MARKER" "$REMOTE_SHA" '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')"
          fi
          exit 1

      # Older Renovate branches do not contain the controller. Use main's copy to
      # persist the target and latest peer blockers immediately after a BLOCKED verdict.
      - uses: actions/checkout@v7
        if: steps.verdict.outputs.verdict == 'BLOCKED'
        with:
          ref: main
          path: controller
          persist-credentials: false
      - name: Install blocked-state controller
        if: steps.verdict.outputs.verdict == 'BLOCKED'
        run: npm ci --prefix controller --ignore-scripts
      - name: Record blocked dependency state
        if: steps.verdict.outputs.verdict == 'BLOCKED'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: node controller/scripts/major-dep-blocked-controller.mjs capture "${{ steps.pr.outputs.number }}" "${{ steps.verdict.outputs.head_sha }}"

      # CI may have failed while the reviewer was still working. A normal CI-completed
      # event has already skipped because no verdict existed then; dispatch the same retry
      # gate now. If CI is still running, its completion event will handle the retry.
      - name: Recheck CI after an adoptable verdict
        if: steps.verdict.outputs.verdict == 'CLEAN' || steps.verdict.outputs.verdict == 'MIGRATED'
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
          PR: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.head_ref }}
          SHA: ${{ steps.verdict.outputs.head_sha }}
        run: |
          set -euo pipefail
          CI=$(gh run list --repo "${{ github.repository }}" --workflow CI --branch "$BRANCH" \
            --limit 30 --json databaseId,headSha,status,conclusion \
            --jq "[.[] | select(.headSha == \"$SHA\")][0] // {}")
          RUN_ID=$(jq -r 'select(.status == "completed" and .conclusion == "failure") | .databaseId // empty' <<<"$CI")
          if [ -n "$RUN_ID" ]; then
            gh workflow run major-dep-agent-ci-retry.yml --repo "${{ github.repository }}" \
              -f pr_number="$PR" -f head_sha="$SHA" -f head_branch="$BRANCH" -f ci_run_id="$RUN_ID"
          fi
