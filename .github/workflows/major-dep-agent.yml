# Upkeep PR #1: reviewed shared implementation pinned to 7147364e6698cf58716d1975e9aec4cf444e8f1a.
name: claude-major-agent

on:
  pull_request_target:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Major dependency PR to review
        required: true
        type: string

concurrency:
  group: claude-major-agent-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  review:
    uses: BohdanMoroz11/upkeep/.github/workflows/review.yml@7147364e6698cf58716d1975e9aec4cf444e8f1a
    with:
      app-client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
      app-slug: ${{ vars.DEP_AGENT_APP_SLUG }}
      base-branch: main
      ci-workflow: ci.yml
      review-workflow: major-dep-agent.yml
      retry-workflow: major-dep-agent-ci-retry.yml
      notification-target: BohdanMoroz11
      legacy-comment-author: BohdanMoroz11
      node-version: 26.13.0
      sanity-command: npm run typecheck
    secrets:
      app-private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
