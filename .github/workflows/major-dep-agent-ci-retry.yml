# Upkeep PR #1: reviewed shared implementation pinned to 7147364e6698cf58716d1975e9aec4cf444e8f1a.
name: claude-major-agent-ci-retry

on:
  workflow_run:
    workflows: [CI] # The name in your CI workflow, not its filename.
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      head_branch:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string

concurrency:
  group: claude-major-ci-retry-${{ github.event.workflow_run.head_branch || inputs.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  retry:
    uses: BohdanMoroz11/upkeep/.github/workflows/retry.yml@7147364e6698cf58716d1975e9aec4cf444e8f1a
    with:
      app-client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
      app-slug: ${{ vars.DEP_AGENT_APP_SLUG }}
      base-branch: main
      ci-workflow: ci.yml
      review-workflow: major-dep-agent.yml
      retry-workflow: major-dep-agent-ci-retry.yml
      notification-target: BohdanMoroz11
      legacy-comment-author: BohdanMoroz11
      node-version: 26.13.0
      sanity-command: npm run typecheck
    secrets:
      app-private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
      claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
