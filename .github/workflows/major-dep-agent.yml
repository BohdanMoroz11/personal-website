name: major-dep-agent
on:
  pull_request:
    types: [labeled]

jobs:
  migrate:
    if: github.event.label.name == 'dep:major-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model opus
            --max-turns 40
          prompt: |
            This PR is a MAJOR version bump of a dependency, flagged because it
            may contain breaking changes. Do the following:

            1. From the PR diff and the release notes in the PR description,
               identify which dependency changed and from which version to which.
            2. Read the changelog / migration guide for that major version to
               find the breaking changes.
            3. Apply whatever code changes THIS repo needs to stay compatible.
               Follow the conventions in CLAUDE.md / AGENTS.md.
            4. Run the project's checks: lint, typecheck, build, and tests
               (see the scripts in package.json).
            5. If everything passes: commit the fix to this PR's branch and post
               a comment summarizing what you changed and why.
            6. If tests fail in a way that needs human judgment, or the migration
               is ambiguous: DO NOT guess or force it. Stop and post a comment
               explaining exactly what's blocking and what you'd recommend.