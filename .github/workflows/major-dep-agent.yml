name: claude-major-agent
on:
  pull_request:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  agent:
    if: >
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'dep:major-review')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model opus
            --max-turns 40
          prompt: |
            This PR is a MAJOR version bump that may contain breaking changes.
            1. Identify the dependency and version change from the diff/release notes.
            2. Find and read the changelog / migration guide for that major version.
            3. Apply the code changes this repo needs (only if there is a need). Follow CLAUDE.md / AGENTS.md.
            4. Run lint, typecheck, build, and tests (see package.json scripts).
            5. If green: commit to this PR's branch (if any changes are needed) and/or comment a summary.
            6. If it needs human judgment: DO NOT guess — comment what's blocking.
