name: major-dep-watchdog

# Backstop for the silent-dormancy failure modes the agent/retry workflows can't self-report:
#   - a major PR that goes into MERGE CONFLICT stops firing pull_request workflows entirely,
#     and Renovate won't auto-rebase a branch that carries the agent's own commits;
#   - CI stays red after the retry loop exhausts its 3 attempts (or a retry crashed).
# In all of these nothing pings a human. This scans open major-review PRs and flags stuck
# ones with an @-mention, keyed to the head commit so you get exactly one ping per bad state.
#
# It also owns the lifecycle of `dep:blocked`. A PR the agent ruled not-adoptable is a settled
# state, not a stuck one — it must not ping. But it must not be forgotten either: when upstream
# actually catches up (the bumped version specifier changes, or the lockfile starts resolving
# that bump), the label is cleared and the agent re-runs. A rebase onto main that only moves
# the SHA is not that signal — that's weekly noise, not ecosystem progress.

on:
  push:
    branches: [main] # a merge here is what tips sibling PRs into conflict — check immediately
  schedule:
    - cron: "0 */6 * * *" # periodic backstop for anything the push check missed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write # needs to re-dispatch major-dep-agent.yml for re-adjudication

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GHCR_PAT }}
      REPO: ${{ github.repository }}
    steps:
      - name: Scan major-review PRs and flag stuck ones
        run: |
          set -euo pipefail

          file_at() {
            local path="$1" ref="$2"
            gh api "repos/${REPO}/contents/${path}?ref=${ref}" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null || true
          }

          deps_json() {
            local src="$1"
            if [ -z "$src" ]; then
              echo '{}'
              return
            fi
            echo "$src" | jq -cS '(.dependencies // {}) + (.devDependencies // {}) + (.optionalDependencies // {})'
          }

          lock_ver() {
            local lock="$1" name="$2"
            if [ -z "$lock" ]; then
              echo ""
              return
            fi
            echo "$lock" | jq -r --arg n "$name" '.packages["node_modules/" + $n].version // empty'
          }

          spec_matches_locked() {
            local spec="$1" locked="$2"
            if [ -z "$spec" ] || [ -z "$locked" ]; then
              return 1
            fi
            case "$spec" in
              ^*)
                local want="${spec:1}"
                [ "${want%%.*}" = "${locked%%.*}" ]
                ;;
              ~*)
                local want="${spec:1}"
                [ "${want%.*}" = "${locked%.*}" ]
                ;;
              *)
                local want="${spec#=}"
                [ "$want" = "$locked" ]
                ;;
            esac
          }

          # Prints a reason and returns 0 when the bump itself changed, not merely the SHA.
          # Wake-ups: package.json specifiers moved since the verdict, or the lockfile now
          # resolves a package this PR bumps relative to main.
          bump_changed_reason() {
            local verdict_sha="$1" head_sha="$2"
            local head_pkg verdict_pkg main_pkg head_lock
            head_pkg=$(file_at package.json "$head_sha")
            verdict_pkg=$(file_at package.json "$verdict_sha")
            main_pkg=$(file_at package.json main)
            head_lock=$(file_at package-lock.json "$head_sha")

            local head_deps verdict_deps main_deps
            head_deps=$(deps_json "$head_pkg")
            verdict_deps=$(deps_json "$verdict_pkg")
            main_deps=$(deps_json "$main_pkg")

            # Packages this PR still disagrees with main about — ignores unrelated
            # specifiers that only moved because the branch was rebased onto main.
            local bumped
            bumped=$(jq -n --argjson head "$head_deps" --argjson main "$main_deps" -r '
              ($head + $main | keys[]) as $k
              | select(($head[$k] // "") != ($main[$k] // ""))
              | $k
            ')

            local name spec locked verdict_spec
            if [ -n "$verdict_pkg" ]; then
              while IFS= read -r name; do
                [ -z "$name" ] && continue
                spec=$(jq -r --arg n "$name" '.[$n] // empty' <<<"$head_deps")
                verdict_spec=$(jq -r --arg n "$name" '.[$n] // empty' <<<"$verdict_deps")
                if [ "$spec" != "$verdict_spec" ]; then
                  echo "package.json specifier for $name changed ($verdict_spec → $spec)"
                  return 0
                fi
              done <<<"$bumped"
            fi

            local resolved=()
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              spec=$(jq -r --arg n "$name" '.[$n] // empty' <<<"$head_deps")
              locked=$(lock_ver "$head_lock" "$name")
              if spec_matches_locked "$spec" "$locked"; then
                resolved+=("$name@$locked")
              fi
            done <<<"$bumped"

            if [ "${#resolved[@]}" -gt 0 ]; then
              echo "lockfile now resolves ${resolved[*]}"
              return 0
            fi
            return 1
          }

          PRS=$(gh pr list --repo "$REPO" --state open --label "dep:major-review" \
            --json number,headRefOid,mergeable,labels --jq '.[] | @base64')
          if [ -z "$PRS" ]; then
            echo "No open major-review PRs — nothing to watch."
            exit 0
          fi

          for row in $PRS; do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            PR=$(_jq '.number')
            SHA=$(_jq '.headRefOid')
            MERGEABLE=$(_jq '.mergeable')
            BLOCKED=$(_jq '[.labels[].name] | index("dep:blocked") // "" | tostring')

            # --- Settled: the agent ruled this bump not adoptable ---------------------------
            if [ -n "$BLOCKED" ]; then
              VERDICT_SHA=$(gh pr view "$PR" --repo "$REPO" --json comments \
                --jq '[.comments[].body | capture("dep-verdict:[A-Z-]+:(?<sha>[0-9a-f]{7,40})").sha] | last // ""')

              if [ -z "$VERDICT_SHA" ] || [ "$VERDICT_SHA" = "$SHA" ]; then
                echo "PR #$PR: blocked at $SHA — settled, staying quiet."
                continue
              fi

              CHANGE_REASON=""
              if CHANGE_REASON=$(bump_changed_reason "$VERDICT_SHA" "$SHA"); then
                echo "PR #$PR: blocked verdict was for $VERDICT_SHA but the bump changed ($CHANGE_REASON) — re-adjudicating."
                # REST rather than `gh pr edit --remove-label`: that resolves labels over
                # GraphQL and needs org-read scope this token doesn't carry.
                gh api -X DELETE "repos/$REPO/issues/$PR/labels/dep:blocked" >/dev/null
                gh pr comment "$PR" --repo "$REPO" --body "$(printf '🔄 The bump has changed since this was ruled **BLOCKED** (`%s` → `%s`): %s. Clearing `dep:blocked` and re-running the review agent.\n\n_(automated watchdog)_' "$VERDICT_SHA" "$SHA" "$CHANGE_REASON")"
                gh workflow run major-dep-agent.yml --repo "$REPO" -f pr_number="$PR"
              else
                echo "PR #$PR: blocked verdict was for $VERDICT_SHA, head is now $SHA, but the bump is unchanged (rebase onto main) — staying quiet."
              fi
              continue
            fi

            REASON=""
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              REASON="has a **merge conflict**. Renovate won't auto-rebase because the branch carries the agent's own commits, so it's stranded until someone ticks Renovate's rebase box or resolves it by hand."
            else
              # Latest CI run for this exact commit (filter by SHA rather than relying on
              # a --commit flag, for portability across gh versions).
              CI=$(gh run list --repo "$REPO" --workflow ci.yml --limit 30 \
                --json headSha,status,conclusion \
                --jq "[.[] | select(.headSha==\"$SHA\")][0] // {}")
              CI_STATUS=$(echo "$CI" | jq -r '.status // ""')
              CI_CONCL=$(echo "$CI" | jq -r '.conclusion // ""')

              if [ "$CI_STATUS" = "completed" ] && [ "$CI_CONCL" = "failure" ]; then
                RETRY_ACTIVE=$(gh run list --repo "$REPO" \
                  --workflow major-dep-agent-ci-retry.yml --limit 15 \
                  --json status,headSha \
                  --jq "[.[] | select(.headSha==\"$SHA\" and (.status==\"in_progress\" or .status==\"queued\"))] | length")
                ATTEMPTS=$(gh pr view "$PR" --repo "$REPO" --json comments \
                  --jq '[.comments[].body | select(contains("<!-- ci-retry-attempt -->"))] | length')

                if [ "$RETRY_ACTIVE" -gt 0 ]; then
                  echo "PR #$PR: CI red but a fixer is running — leaving it."
                elif [ "$ATTEMPTS" -ge 3 ]; then
                  REASON="has **red CI after 3 automated fix attempts** — the retry loop has given up."
                else
                  REASON="has **red CI and no fixer is running** — the retry agent likely crashed before pushing a fix."
                fi
              fi
            fi

            [ -z "$REASON" ] && { echo "PR #$PR: healthy or in progress."; continue; }

            # One ping per commit: skip if this exact SHA was already flagged. The agent
            # workflows post their no-verdict warnings under the same marker, so a crashed
            # run that already pinged won't get double-reported here.
            MARKER="<!-- watchdog:$SHA -->"
            ALREADY=$(gh pr view "$PR" --repo "$REPO" --json comments \
              --jq "[.comments[].body | select(contains(\"$MARKER\"))] | length")
            if [ "$ALREADY" -gt 0 ]; then
              echo "PR #$PR: already flagged for $SHA — skipping."
              continue
            fi

            BODY=$(printf '%s\n⚠️ @BohdanMoroz11 — major-dependency PR #%s %s\n\n_(automated watchdog — one ping per commit)_' \
              "$MARKER" "$PR" "$REASON")
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
            echo "PR #$PR: flagged ($REASON)"
          done
