name: major-dep-watchdog

# Backstop for the silent-dormancy failure modes the agent/retry workflows can't self-report:
#   - a major PR that goes into MERGE CONFLICT stops firing pull_request workflows entirely,
#     and Renovate won't auto-rebase a branch that carries the agent's own commits;
#   - CI stays red after the retry loop exhausts its 3 attempts (or a retry crashed).
# In all of these nothing pings a human. This scans open major-review PRs and flags stuck
# ones with an @-mention, keyed to the head commit so you get exactly one ping per bad state.
#
# It also owns the lifecycle of `dep:blocked`. A PR the agent ruled not-adoptable is a settled
# state, not a stuck one — it must not ping. But it must not be forgotten either: when upstream
# actually catches up (all recorded direct peer blockers support the target), the target
# specifier changes, or its lockfile entry resolves, the agent re-runs. Unrelated dependency
# updates and routine rebases do not wake a blocked PR.

on:
  push:
    branches: [main] # a merge here is what tips sibling PRs into conflict — check immediately
  schedule:
    - cron: "0 */6 * * *" # periodic backstop for anything the push check missed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency:
      group: major-dep-watchdog-scan
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check dedicated App configuration
        env:
          APP_CLIENT_ID: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
          APP_SLUG: ${{ vars.DEP_AGENT_APP_SLUG }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ] || [ -z "$APP_SLUG" ]; then
            echo '::error::Configure DEP_AGENT_APP_CLIENT_ID, DEP_AGENT_APP_PRIVATE_KEY, and DEP_AGENT_APP_SLUG before running the dependency watchdog.'
            exit 1
          fi
      - uses: actions/create-github-app-token@v3
        id: watchdog_token
        with:
          client-id: ${{ vars.DEP_AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEP_AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write
      - name: Scan major-review PRs and flag stuck ones
        env:
          GH_TOKEN: ${{ steps.watchdog_token.outputs.token }}
          DEP_AGENT_APP_SLUG: ${{ vars.DEP_AGENT_APP_SLUG }}
          ACTUAL_APP_SLUG: ${{ steps.watchdog_token.outputs.app-slug }}
        run: |
          set -euo pipefail
          test "$ACTUAL_APP_SLUG" = "$DEP_AGENT_APP_SLUG"
          BOT_NAME="${DEP_AGENT_APP_SLUG}[bot]"

          PRS=$(gh pr list --repo "$REPO" --state open --label "dep:major-review" \
            --json number,headRefName,headRefOid,mergeable,labels --jq '.[] | @base64')
          if [ -z "$PRS" ]; then
            echo "No open major-review PRs — nothing to watch."
            exit 0
          fi

          REJECTED=0
          for row in $PRS; do
            _jq() { echo "$row" | base64 --decode | jq -r "$1"; }
            PR=$(_jq '.number')
            BRANCH=$(_jq '.headRefName')
            SHA=$(_jq '.headRefOid')
            MERGEABLE=$(_jq '.mergeable')
            BLOCKED=$(_jq '[.labels[].name] | index("dep:blocked") // "" | tostring')

            if ! node scripts/major-dep-verify-head.mjs "$PR" "$SHA" "$BRANCH"; then
              echo "::error::PR #$PR failed trusted Renovate preflight — skipping."
              REJECTED=$((REJECTED + 1))
              continue
            fi

            # --- Settled: the agent ruled this bump not adoptable ---------------------------
            if [ -n "$BLOCKED" ]; then
              node scripts/major-dep-blocked-controller.mjs scan "$PR" "$SHA"
              continue
            fi

            REASON=""
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              REASON="has a **merge conflict**. Renovate won't auto-rebase because the branch carries the agent's own commits, so it's stranded until someone ticks Renovate's rebase box or resolves it by hand."
            else
              # Latest CI run for this exact commit (filter by SHA rather than relying on
              # a --commit flag, for portability across gh versions).
              CI=$(gh run list --repo "$REPO" --workflow ci.yml --limit 30 \
                --json headSha,status,conclusion \
                --jq "[.[] | select(.headSha==\"$SHA\")][0] // {}")
              CI_STATUS=$(echo "$CI" | jq -r '.status // ""')
              CI_CONCL=$(echo "$CI" | jq -r '.conclusion // ""')

              if [ "$CI_STATUS" = "completed" ] && [ "$CI_CONCL" = "failure" ]; then
                RETRY_ACTIVE=$(gh run list --repo "$REPO" \
                  --workflow major-dep-agent-ci-retry.yml --limit 15 \
                  --json status,headSha \
                  --jq "[.[] | select(.headSha==\"$SHA\" and (.status==\"in_progress\" or .status==\"queued\"))] | length")
                # Count attempts since the latest initial verdict. A later review starts
                # a new retry budget, even when it happens on the same long-lived PR.
                ATTEMPTS=$(gh pr view "$PR" --repo "$REPO" --json comments | jq \
                  --arg owner "${{ github.repository_owner }}" --arg bot "$BOT_NAME" '
                  [.comments[] | select(.author.login == $owner or .author.login == $bot) | .body] as $b
                  | ([$b | to_entries[] | select(.value | startswith("<!-- dep-verdict:")) | .key] | last // -1) as $verdict
                  | [range($verdict + 1; $b | length) as $i
                     | select($b[$i] | startswith("<!-- ci-retry-attempt -->"))] | length')

                if [ "$RETRY_ACTIVE" -gt 0 ]; then
                  echo "PR #$PR: CI red but a fixer is running — leaving it."
                elif [ "$ATTEMPTS" -ge 3 ]; then
                  REASON="has **red CI after 3 automated fix attempts** — the retry loop has given up."
                else
                  REASON="has **red CI and no fixer is running** — the retry agent likely crashed before pushing a fix."
                fi
              fi
            fi

            [ -z "$REASON" ] && { echo "PR #$PR: healthy or in progress."; continue; }

            # One ping per commit: skip if this exact SHA was already flagged. The agent
            # workflows post their no-verdict warnings under the same marker, so a crashed
            # run that already pinged won't get double-reported here.
            MARKER="<!-- watchdog:$SHA -->"
            ALREADY=$(gh pr view "$PR" --repo "$REPO" --json comments | jq \
              --arg owner "${{ github.repository_owner }}" --arg bot "$BOT_NAME" --arg marker "$MARKER" \
              '[.comments[] | select(.author.login == $owner or .author.login == $bot) | .body | select(contains($marker))] | length')
            if [ "$ALREADY" -gt 0 ]; then
              echo "PR #$PR: already flagged for $SHA — skipping."
              continue
            fi

            BODY=$(printf '%s\n⚠️ @BohdanMoroz11 — major-dependency PR #%s %s\n\n_(automated watchdog — one ping per commit)_' \
              "$MARKER" "$PR" "$REASON")
            gh pr comment "$PR" --repo "$REPO" --body "$BODY"
            echo "PR #$PR: flagged ($REASON)"
          done
          if [ "$REJECTED" -gt 0 ]; then
            echo "::error::$REJECTED major-review PR(s) failed trust checks."
            exit 1
          fi
