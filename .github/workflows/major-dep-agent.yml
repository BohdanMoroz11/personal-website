name: claude-major-agent
on:
  pull_request:
    types: [opened, labeled]

jobs:
  agent:
    if: >
      github.actor != 'claude[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'dep:major-review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GHCR_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GHCR_PAT }}
          claude_args: |
            --model sonnet
            --max-turns 25
            --permission-mode acceptEdits
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(npm run typecheck),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
          prompt: |
            This PR is a MAJOR dependency bump. You are the AUTHOR, not the
            validator — CI runs the full test suite (incl. e2e), so do NOT
            run build/unit/e2e yourself.

            1. Identify the dependency and version change from the diff + release notes.
            2. Read the actual changelog / migration guide for the new major.
            3. Decide if this repo needs ANY code changes. Many majors need none —
               if so, say so plainly and DO NOT invent changes.
            4. If changes are needed: make them (follow CLAUDE.md / AGENTS.md),
               then run ONLY `npm run typecheck` as a sanity check and fix breakage.
            5. Commit any changes to this PR's branch.
            6. ALWAYS post a summary via:
               gh pr comment ${{ github.event.pull_request.number }} --body "..."
               The summary MUST include, for every breaking change you mention,
               a direct link to the changelog/release-notes URL you read it from,
               so I can verify it. State clearly whether code changes were needed.
            7. If it needs human judgment, comment what's blocking instead of guessing.
